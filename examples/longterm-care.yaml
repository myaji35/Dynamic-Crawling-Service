# FlexCrawler - 노인장기요양보험 시설 정보 크롤링
# longtermcare.or.kr 장기요양기관 정보 수집

version: '1.0'

job:
  name: '노인장기요양보험 시설 정보 크롤링'
  description: '전국 장기요양기관(요양원, 재가센터 등) 정보 및 현황 데이터 수집'

  pipeline:
    - step: crawl
      source:
        type: web
        url: 'https://longtermcare.or.kr/npbs/r/a/201/selectXLtcoSrch'

        timeout: 40000
        wait_for: networkidle

        fields:
          # 기관명
          facility_names:
            selector: '.list-table tbody td.left'
            multiple: true
            transform: trim

          # 시설 유형 (요양원, 주야간보호, 방문요양 등)
          facility_types:
            selector: '.list-table tbody td:nth-child(2)'
            multiple: true
            transform: trim

          # 주소
          addresses:
            selector: '.list-table tbody td:nth-child(3)'
            multiple: true
            transform: remove_whitespace

          # 전화번호
          phone_numbers:
            selector: '.list-table tbody td:nth-child(4)'
            multiple: true
            transform: trim

          # 정원 (수용 인원)
          capacities:
            selector: '.list-table tbody td:nth-child(5)'
            multiple: true
            transform: extract_number

          # 현원 (현재 이용자 수)
          current_users:
            selector: '.list-table tbody td:nth-child(6)'
            multiple: true
            transform: extract_number

          # 평가등급
          ratings:
            selector: '.list-table tbody td:nth-child(7)'
            multiple: true
            transform: trim

      retry:
        max_attempts: 3
        backoff: exponential

    - step: transform
      rules:
        # 유효한 데이터만 필터링
        - filter: '${facility_names.length > 0}'

        # 정원이 있는 시설만 (유효성 검증)
        - filter: '${capacities.length > 0}'

        # 중복 제거
        - deduplicate: ['facility_names']

    - step: load
      destination:
        type: json
        path: './output/longterm-care-facilities.json'

  # 스케줄링 (매주 데이터 업데이트)
  schedule:
    type: cron
    expression: '0 9 * * 1' # 매주 월요일 오전 9시
    timezone: 'Asia/Seoul'

  # 알림 설정
  notifications:
    on_success:
      - type: log
        message: '장기요양기관 정보 크롤링 완료'
    on_failure:
      - type: log
        level: error
        message: '장기요양기관 정보 크롤링 실패'
