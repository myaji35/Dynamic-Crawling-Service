# Cloud Build Configuration for Dynamic Crawling Service
# Deploys crawling-worker to Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/crawling-worker:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/crawling-worker:latest'
      - '-f'
      - 'crawling-worker/Dockerfile'
      - './crawling-worker'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/crawling-worker:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/crawling-worker:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crawling-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/crawling-worker:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3' # Seoul region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # For Pub/Sub push
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '60s'
      - '--max-instances'
      - '100'
      - '--min-instances'
      - '0'
      - '--concurrency'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest'

images:
  - 'gcr.io/$PROJECT_ID/crawling-worker:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/crawling-worker:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s # 20 minutes
